<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Braumeister · Vom Malz zum Bier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg: oklch(0.985 0.002 240);
  --card: oklch(0.995 0.001 240);
  --ink: oklch(0.24 0.006 240);
  --muted: oklch(0.45 0.006 240);
  --line: oklch(0.89 0.004 240);
  --line-strong: oklch(0.78 0.005 240);
  --ac9: oklch(0.28 0.06 155);
  --ac7: oklch(0.38 0.075 155);
  --ac5: oklch(0.52 0.09 155);
  --ac2: oklch(0.88 0.05 155);
  --ac1: oklch(0.95 0.025 155);
  --warn: oklch(0.50 0.12 65);
  --warn-bg: oklch(0.96 0.04 85);
  --bad: oklch(0.46 0.16 27);
  --bad-bg: oklch(0.965 0.025 27);
  --radius: 10px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:18px;line-height:1.5}
h1,h2,h3{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:600;line-height:1.2;margin:0 0 .5em;color:var(--ac9)}
h1{font-size:2.1rem}
h2{font-size:1.5rem}
h3{font-size:1.15rem}
p{margin:0 0 .9em}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}
header.top{border-bottom:1px solid var(--line);background:var(--card)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:12px}
.brand{font-family:'Fraunces',Georgia,serif;font-weight:600;color:var(--ac9);font-size:1.15rem}
.xp{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;font-size:.9rem;background:var(--ac1);border:1px solid var(--ac2);color:var(--ac9);padding:4px 12px;border-radius:999px;white-space:nowrap}
ol.steps{list-style:none;display:flex;gap:6px;padding:0;margin:18px 0 6px}
ol.steps li{flex:1;text-align:center;font-size:.8rem;color:var(--muted);border-top:4px solid var(--line);padding-top:6px}
ol.steps li.done{border-top-color:var(--ac5);color:var(--ac7)}
ol.steps li.cur{border-top-color:var(--ac9);color:var(--ac9);font-weight:700}
main{padding:12px 0 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin:14px 0}
.lead{font-size:1.1rem;color:var(--ink)}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.btn{appearance:none;border:0;border-radius:8px;background:var(--ac7);color:#fff;font:inherit;font-weight:600;padding:12px 22px;min-height:48px;cursor:pointer}
.btn:hover:not(:disabled){background:var(--ac9)}
.btn:disabled{background:var(--line-strong);cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ac7);border:1.5px solid var(--ac5)}
.btn.ghost:hover:not(:disabled){background:var(--ac1)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
:focus-visible{outline:3px solid var(--ac5);outline-offset:2px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:8px 0 20px}
button.choice{appearance:none;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line-strong);border-radius:var(--radius);padding:12px 14px;cursor:pointer;min-height:64px}
button.choice:hover{border-color:var(--ac5)}
button.choice[aria-pressed="true"]{border-color:var(--ac7);background:var(--ac1);box-shadow:inset 0 0 0 1px var(--ac7)}
button.choice b{display:block;color:var(--ac9)}
button.choice span{font-size:.9rem;color:var(--muted)}
.ctl{margin:18px 0 26px}
.ctl .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.ctl label{font-weight:600}
.ctl output{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;color:var(--ac9);background:var(--ac1);border:1px solid var(--ac2);padding:2px 10px;border-radius:6px}
.track{position:relative;height:12px;border-radius:6px;background:var(--line);margin:0 12px}
.track .band{position:absolute;top:0;bottom:0;background:var(--ac2);border-radius:6px;border:1px solid var(--ac5)}
.track input{position:absolute;left:-12px;top:-10px;width:calc(100% + 24px);height:32px;margin:0;background:transparent;-webkit-appearance:none;appearance:none}
.track input::-webkit-slider-runnable-track{background:transparent;height:32px}
.track input::-moz-range-track{background:transparent;height:32px}
.track input::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:2px;border-radius:50%;background:var(--ac7);border:3px solid #fff;box-shadow:0 0 0 1.5px var(--ac7)}
.track input::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--ac7);border:3px solid #fff;box-shadow:0 0 0 1.5px var(--ac7)}
.scale{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin:6px 0 0}
.tip{background:var(--ac1);border:1px solid var(--ac2);border-left:4px solid var(--ac5);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:.95rem}
.box-warn{background:var(--warn-bg);border:1px solid oklch(0.85 0.08 85);border-left:4px solid var(--warn);border-radius:8px;padding:10px 14px;margin:12px 0}
.box-bad{background:var(--bad-bg);border:1px solid oklch(0.85 0.06 27);border-left:4px solid var(--bad);border-radius:8px;padding:14px 16px;margin:12px 0}
.box-bad h2{color:var(--bad)}
.score{display:flex;align-items:center;gap:14px;margin:6px 0 14px}
.bar{flex:1;height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac5);border-radius:7px}
.score b{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;color:var(--ac9);white-space:nowrap}
ul.fb{list-style:none;padding:0;margin:0}
ul.fb li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
ul.fb li:first-child{border-top:0}
ul.fb .mark{flex:0 0 auto;font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;font-weight:500;padding:2px 8px;border-radius:6px;height:fit-content;margin-top:3px}
ul.fb .ok .mark{background:var(--ac1);color:var(--ac7);border:1px solid var(--ac2)}
ul.fb .no .mark{background:var(--warn-bg);color:var(--warn);border:1px solid oklch(0.85 0.08 85)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.9rem;margin-bottom:6px}
.legend span::before{content:"";display:inline-block;width:26px;height:0;border-top:3px solid;margin-right:6px;vertical-align:middle}
.legend .l1::before{border-color:#2f6b4a}
.legend .l2::before{border-color:#b86b00;border-top-style:dashed}
canvas{width:100%;height:260px;display:block;background:#fff;border:1px solid var(--line);border-radius:8px}
.readouts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.readouts div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:center}
.readouts b{display:block;font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;font-size:1.15rem;color:var(--ac9)}
.readouts span{font-size:.8rem;color:var(--muted)}
.qopts{display:grid;gap:10px;margin:14px 0}
button.qopt{appearance:none;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line-strong);border-radius:var(--radius);padding:12px 14px;cursor:pointer;min-height:52px}
button.qopt:hover:not(:disabled){border-color:var(--ac5);background:var(--ac1)}
button.qopt:disabled{cursor:default}
button.qopt.right{border-color:var(--ac7);background:var(--ac1);box-shadow:inset 0 0 0 1px var(--ac7)}
button.qopt.wrong{border-color:var(--warn);background:var(--warn-bg)}
button.qopt .tag{display:inline-block;font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;font-size:.75rem;margin-right:8px;padding:1px 7px;border-radius:5px;background:#fff;border:1px solid var(--line-strong)}
.trophy{display:block;margin:0 auto 6px;width:110px;height:110px}
.final-head{text-align:center}
.final-head .big{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;font-size:2.4rem;color:var(--ac9);font-weight:500}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:.85rem;border-top:0}
td.n,th.n{text-align:right;font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.facts div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.facts span{display:block;font-size:.8rem;color:var(--muted)}
.facts b{color:var(--ac9)}
footer{border-top:1px solid var(--line);background:var(--card);padding:18px 0}
footer .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between}
footer img{height:44px;width:auto;display:block}
footer p{margin:0;font-size:.9rem;color:var(--muted)}
.hint-line{margin:0;font-size:.85rem;color:var(--muted)}

/* ---- v2: Stile, Ziele, Anzeigen, Bilder ---- */
.stylegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:14px 0}
button.stylecard{appearance:none;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line-strong);border-radius:var(--radius);padding:14px;cursor:pointer}
button.stylecard:hover{border-color:var(--ac5)}
button.stylecard[aria-pressed="true"]{border-color:var(--ac7);background:var(--ac1);box-shadow:inset 0 0 0 1px var(--ac7)}
button.stylecard .glassmini{display:block;width:44px;height:62px;margin-bottom:8px}
button.stylecard b{display:block;font-family:'Fraunces',Georgia,serif;font-size:1.15rem;color:var(--ac9)}
button.stylecard p{font-size:.92rem;color:var(--muted);margin:.3em 0 .6em}
.badge{display:inline-block;font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;font-size:.72rem;padding:1px 8px;border-radius:999px;border:1px solid var(--ac5);color:var(--ac7);background:#fff;margin-right:6px}
.badge.craft{background:var(--ac9);color:#fff;border-color:var(--ac9)}
.target{background:var(--bg);border:1px dashed var(--line-strong);border-radius:8px;padding:8px 12px;margin:10px 0;font-size:.9rem}
.target b{color:var(--ac9)}
.target .tv{display:inline-block;margin:2px 12px 2px 0;white-space:nowrap}
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:14px 0 4px}
.gauge{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.gauge .gh{display:flex;justify-content:space-between;align-items:baseline;font-size:.9rem}
.gauge .gh b{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;color:var(--ac9)}
.gbar{position:relative;height:12px;border-radius:6px;background:var(--line);margin:8px 0 4px}
.gbar .win{position:absolute;top:0;bottom:0;background:var(--ac2);border:1px solid var(--ac5);border-radius:6px}
.gbar .mk{position:absolute;top:-4px;width:6px;height:20px;border-radius:3px;background:var(--warn);transform:translateX(-3px);transition:left .25s}
.gbar .mk.in{background:var(--ac7)}
.gauge .gf{font-size:.78rem;color:var(--muted)}
svg.scene{display:block;width:100%;height:auto;background:linear-gradient(#fbfcfb,#f1f5f2);border:1px solid var(--line);border-radius:10px;margin:10px 0}
svg .svt{font:600 13px 'JetBrains Mono',ui-monospace,monospace;fill:#2a4a38}
svg .svs{font:12px 'Source Sans 3',system-ui,sans-serif;fill:#5a6560}
svg .svl{font:600 13px 'Source Sans 3',system-ui,sans-serif;fill:#2a4a38}
.finalglass{display:block;margin:0 auto 8px;width:150px}
.cmp td.ok{color:var(--ac7);font-weight:600}
.cmp td.no{color:var(--warn);font-weight:600}

@keyframes rise{0%{transform:translateY(0);opacity:0}12%{opacity:.9}100%{transform:translateY(-70px);opacity:0}}
@keyframes steam{0%{transform:translateY(0) scaleX(1);opacity:0}25%{opacity:.7}100%{transform:translateY(-34px) scaleX(1.25);opacity:0}}
@keyframes stir{0%,100%{transform:translateX(-36px)}50%{transform:translateX(36px)}}
@keyframes dropin{0%{transform:translateY(-30px);opacity:0}15%{opacity:1}70%{transform:translateY(62px);opacity:1}85%,100%{transform:translateY(70px);opacity:0}}
@keyframes flame{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.25)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}30%{opacity:.9}100%{transform:scale(1.2);opacity:0}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(8px,-6px)}}
@keyframes bud{0%,100%{transform:scale(.55)}50%{transform:scale(1)}}
@keyframes fillup{0%{transform:scaleY(0)}100%{transform:scaleY(1)}}
@keyframes foamup{0%,60%{transform:translateY(14px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes glint{0%,100%{opacity:.35}50%{opacity:1}}
.stir{animation:stir 3.2s ease-in-out infinite}
.steam{animation:steam 3.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.flame{animation:flame .7s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
.bubp{animation:pop 1.3s ease-out infinite;transform-box:fill-box;transform-origin:center}
.dropin{animation:dropin 4.2s ease-in infinite}
.cellfloat{animation:drift 5s ease-in-out infinite}
.budding{animation:bud 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.bub{animation:rise var(--bd,2s) linear infinite}
.idle .bub,.idle .blip{opacity:0;animation:none}
.snow{animation:glint 2.4s ease-in-out infinite}
.fillbeer{transform-box:fill-box;transform-origin:bottom;animation:fillup 2.6s ease-out both}
.foam{animation:foamup 3.2s ease-out both}
@media (prefers-reduced-motion: reduce){
  .stir,.steam,.flame,.bubp,.dropin,.cellfloat,.budding,.bub,.snow,.fillbeer,.foam,.blip{animation:none!important}
}
@media (max-width:520px){
  body{font-size:17px}
  h1{font-size:1.7rem}
  .card{padding:16px}
  .readouts{grid-template-columns:1fr}
  .cmp th,.cmp td{font-size:.8rem;padding:6px 3px}
  .cmp td.n{white-space:nowrap}
}
</style>
</head>

/* ---------- Modell ---------- */
function tf(T, opt){
  if(T>=opt[0] && T<=opt[1]) return 1;
  var d = T<opt[0] ? opt[0]-T : T-opt[1];
  return Math.max(0, 1-d/8);
}
function mashE(T,D){
  var tfac;
  if(T>=78) tfac=0;
  else if(T>=62 && T<=72) tfac=1;
  else if(T<62) tfac=Math.max(0,1-(62-T)/22);
  else tfac=1-(T-72)/6*0.6;
  var timef=Math.min(1,0.3+0.7*D/45);
  return {tfac:tfac,timef:timef,e:tfac*timef};
}
function s0From(e){ return st.kg*2.1*(0.3+0.7*e)*GRUND[st.grund].f; }
function ebcNow(){ if(!st.grund||!st.spez) return null; return GRUND[st.grund].ebc+SPEZ[st.spez].ebc; }
function s0Now(){ if(!st.grund) return null; return s0From(mashE(st.mashT,st.mashD).e); }
function ibuNow(){ return st.bitterG*Math.min(1,st.kochD/60)+st.aromaG*0.3; }
function aromaNow(){ return st.aromaG+1.6*st.kaltG; }
function makeSim(S0, hefe, T){
  var y = YEASTS[hefe], F0 = 0.8*S0, f = tf(T,y.opt);
  var q = 1 - y.k*f;
  return function(t){
    var F = F0*Math.pow(q,t);
    var ferm = F0-F;
    return {ferm:ferm, sugar:S0-ferm, alc:ferm*0.52, co2:ferm*10*0.49, deg:F0>0?ferm/F0:0};
  };
}
function bandFor(step){
  var S = st.style?STYLES[st.style]:null, y = st.hefe?YEASTS[st.hefe]:null;
  if(!st.hints[step]||!S) return {};
  if(step===1){
    var f=st.grund?GRUND[st.grund].f:1;
    return {mashT:[58,76], kg:[S.S0[0]/(2.1*f), S.S0[1]/(2.1*f)]};
  }
  if(step===2) return {kochD:[60,90], bitterG:[Math.max(0,S.ibu[0]-0.3*st.aromaG), Math.max(0,S.ibu[1]-0.3*st.aromaG)], anstT: y?[y.opt[0]-3,y.opt[1]+3]:null};
  if(step===3) return {gaerT: y?[y.opt[0]-3,y.opt[1]+3]:null, gaerD:[5,10]};
  if(step===4) return {lagerW:S.lager, lagerT:[0,8], kaltG:[Math.max(0,(S.aroma[0]-st.aromaG)/1.6), Math.max(0,(S.aroma[1]-st.aromaG)/1.6)]};
  return {};
}

/* ---------- Auswertungen ---------- */
function failRes(title,text,tip){ return {fail:{title:title,text:text,tip:tip}}; }

function eval1(){
  var S=STYLES[st.style], L=[], ebc=ebcNow();
  var pm=S.fitMalz[st.grund];
  if(st.grund==='roh') L.push({ok:false,t:'Rohe Gerste: Es fehlen die Enzyme, die beim Keimen entstehen. Die Stärke bleibt grösstenteils ungenutzt und du holst viel weniger Zucker heraus.'});
  else if(pm>=4) L.push({ok:true,t:GRUND[st.grund].name+': Passt gut zu einem '+S.name+'. Beim Mälzen sind Enzyme entstanden, die später die Stärke abbauen.'});
  else L.push({ok:false,t:GRUND[st.grund].name+' geht, ist für dieses Bier aber ungewöhnlich. '+S.malzHint});
  var pc=5*fit(ebc,S.ebc[0],S.ebc[1],25);
  if(pc>=4) L.push({ok:true,t:'Farbe: Etwa '+ebc+' EBC passt zum Stil.'});
  else if(ebc<S.ebc[0]) L.push({ok:false,t:'Farbe: Mit etwa '+ebc+' EBC wird das Bier zu hell für ein '+S.name+'. Mit Karamell- oder Röstmalz wird es dunkler.'});
  else L.push({ok:false,t:'Farbe: Mit etwa '+ebc+' EBC wird das Bier zu dunkel für ein '+S.name+'. Weniger Spezialmalz hilft.'});
  var ph=S.fitHefe[st.hefe];
  if(st.hefe==='baecker') L.push({ok:false,t:'Bäckerhefe gärt zwar, ist aber auf Brotteig gezüchtet. Das Bier schmeckt hefig und brotig.'});
  else if(ph>=5) L.push({ok:true,t:YEASTS[st.hefe].name+': Die richtige Hefe für dieses Bier. '+YEASTS[st.hefe].desc+'.'});
  else L.push({ok:false,t:YEASTS[st.hefe].name+' funktioniert, ist aber nicht typisch. '+S.hefeHint});
  return {pts:pm+pc+ph, lines:L};
}

function eval2(){
  var S=STYLES[st.style], T=st.mashT, D=st.mashD, m=mashE(T,D), L=[];
  if(T>=78) return failRes('Fehlsud: Die Enzyme sind kaputt',
    'Bei '+T+' °C werden die Enzyme zerstört (denaturiert). Enzyme sind Eiweisse und verändern bei Hitze ihre Form. Sie können keine Stärke mehr abbauen. Bei der Jodprobe bliebe die Maische blauschwarz.',
    'Enzyme arbeiten gern warm, aber nicht heiss. Versuch es mit einer tieferen Temperatur.');
  if(m.e<0.25) return failRes('Fehlsud: Die Stärke wurde kaum abgebaut',
    'Bei '+T+' °C und '+D+' Minuten arbeiten die Enzyme viel zu wenig. Bei der Jodprobe bleibt die Maische blauschwarz. Das heisst: Es ist noch fast alles Stärke und kaum Zucker.',
    'Die Enzyme brauchen es wärmer und etwas mehr Zeit.');
  if(m.tfac===1) L.push({ok:true,t:'Temperatur: '+T+' °C liegt im Arbeitsbereich der Malz-Enzyme. Sie bauen die Stärke zu Zucker ab.'});
  else if(T<62) L.push({ok:false,t:'Temperatur: '+T+' °C ist zu kühl. Die Enzyme arbeiten, aber langsam. Es entsteht weniger Zucker.'});
  else L.push({ok:false,t:'Temperatur: '+T+' °C ist schon zu heiss. Ein Teil der Enzyme wird geschädigt, die Zuckerausbeute sinkt.'});
  if(m.timef>=1) L.push({ok:true,t:'Rastzeit: '+D+' Minuten genügen, damit die Stärke fast vollständig abgebaut ist.'});
  else L.push({ok:false,t:'Rastzeit: '+D+' Minuten sind zu kurz. Ein Teil der Stärke wird nicht mehr abgebaut.'});
  var S0=s0From(m.e), fs=fit(S0,S.S0[0],S.S0[1],4);
  if(fs===1) L.push({ok:true,t:'Stammwürze: '+r1(S0)+' °P passen zu einem '+S.name+'. Die Menge an Malz stimmt.'});
  else if(S0<S.S0[0]) L.push({ok:false,t:'Stammwürze: '+r1(S0)+' °P sind zu wenig für ein '+S.name+' (Ziel '+S.S0[0]+' bis '+S.S0[1]+'). Das Bier wird dünn und alkoholarm. Mehr Malz oder bessere Maischbedingungen helfen.'});
  else L.push({ok:false,t:'Stammwürze: '+r1(S0)+' °P sind zu viel für ein '+S.name+' (Ziel '+S.S0[0]+' bis '+S.S0[1]+'). Das Bier wird zu schwer und süss. Weniger Malz hilft.'});
  return {pts:10*m.e+5*fs, e:m.e, S0:S0, lines:L};
}

  var pa=7*fit(ar,S.aroma[0],S.aroma[1],60);
  if(pa>=6) L.push({ok:true,t:'Hopfenaroma: Index '+Math.round(ar)+' passt zu einem '+S.name+'.'});
  else if(ar<S.aroma[0]) L.push({ok:false,t:'Hopfenaroma: Index '+Math.round(ar)+' ist zu schwach (Ziel '+S.aroma[0]+' bis '+S.aroma[1]+'). Spät zugegebener Aromahopfen und Kalthopfung bringen mehr Duft.'});
  else L.push({ok:false,t:'Hopfenaroma: Index '+Math.round(ar)+' ist zu stark (Ziel '+S.aroma[0]+' bis '+S.aroma[1]+'). Das Bier riecht zu stark nach Hopfen für diesen Stil.'});
  return {pts:pw+pt+pa, lines:L};
}

function gaugesFor(i){
  var S=STYLES[st.style];
  if(i===0) return [{id:'ebc',label:'Farbe',unit:'EBC',min:0,max:100,win:S.ebc,val:ebcNow,dec:0}];
  if(i===1) return [{id:'s0',label:'Stammwürze (Prognose)',unit:'°P',min:4,max:20,win:S.S0,val:s0Now,dec:1}];
  if(i===2) return [{id:'ibu',label:'Bitterkeit',unit:'IBU',min:0,max:100,win:S.ibu,val:ibuNow,dec:0}];
  if(i===4) return [{id:'aro',label:'Hopfenaroma (Index)',unit:'',min:0,max:220,win:S.aroma,val:aromaNow,dec:0}];
  return [];
}
function gaugeHTML(g){
  var wl=(g.win[0]-g.min)/(g.max-g.min)*100, ww=(g.win[1]-g.win[0])/(g.max-g.min)*100;
  return '<div class="gauge"><div class="gh"><span>'+g.label+'</span><b id="gv_'+g.id+'">–</b></div><div class="gbar"><i class="win" style="left:'+wl+'%;width:'+ww+'%"></i><i class="mk" id="gm_'+g.id+'" style="left:0%"></i></div><div class="gf">Ziel: '+g.win[0]+' bis '+g.win[1]+(g.unit?' '+g.unit:'')+'</div></div>';
}
function updateLive(){
  var i=st.step; if(st.screen!=='station') return;
  gaugesFor(i).forEach(function(g){
    var v=g.val(), mk=document.getElementById('gm_'+g.id), tx=document.getElementById('gv_'+g.id);
    if(!mk) return;
    if(v===null){ tx.textContent='–'; mk.style.visibility='hidden'; return; }
    mk.style.visibility='visible';
    mk.style.left=(clamp((v-g.min)/(g.max-g.min),0,1)*100)+'%';
    mk.className='mk'+(v>=g.win[0]&&v<=g.win[1]?' in':'');
    tx.textContent=v.toFixed(g.dec)+(g.unit?' '+g.unit:'');
  });
  if(i===0){ var e=ebcNow(), b=document.getElementById('pv_beer'); if(b&&e!==null) b.setAttribute('fill',ebcColor(e)); }
  if(i===1){ setThermo('thm',st.mashT,40,90,'°C'); var sg=document.getElementById('steamg'); if(sg) sg.style.opacity=clamp((st.mashT-35)/50,0.05,1); }
  if(i===2) setThermo('tha',st.anstT,4,60,'°C');
  if(i===3){
    setThermo('thg',st.gaerT,2,40,'°C');
    var sc=document.getElementById('tankscene');
    if(sc){
      var y=YEASTS[st.hefe], f=st.gaerT>=38?0:tf(st.gaerT,y.opt)*y.k/0.45;
      if(f<=0.02){ sc.classList.add('idle'); }
      else { sc.classList.remove('idle'); sc.style.setProperty('--bd',(0.8+(1-clamp(f,0,1))*3.2)+'s'); }
      var tb=document.getElementById('tankbeer'); if(tb) tb.setAttribute('fill', st.gaerT>=38?'#9a8f7a':'#e8b032');
    }
  }
  if(i===4){ setThermo('thl',st.lagerT,0,20,'°C'); var kh=document.getElementById('kalthop'); if(kh) kh.style.opacity=st.kaltG>0?1:0; }
}

/* ---------- Rendering ---------- */
function setHeader(){
  var h='';
  for(var i=0;i<5;i++){
    var cls = st.screen==='final' ? 'done' : (i<st.step ? 'done' : (i===st.step && (st.screen!=='start'&&st.screen!=='style') ? 'cur':''));
    h+='<li class="'+cls+'"'+(cls==='cur'?' aria-current="step"':'')+'>'+NAMES[i]+'</li>';
  }
  stepsEl.innerHTML=h;
  xpEl.textContent = total()+' Punkte';
}
function stopAnim(){ if(raf){ cancelAnimationFrame(raf); raf=0; } }
function render(){
  stopAnim();
  setHeader();
  var s=st.screen;
  if(s==='start') renderStart();
  else if(s==='style') renderStyle();
  else if(s==='station') renderStation();
  else if(s==='fail') renderFail();
  else if(s==='result') renderResult();
  else if(s==='quiz') renderQuiz();
  else renderFinal();
  window.scrollTo(0,0);
}

function renderStart(){
  app.innerHTML =
   '<div class="card"><h1>Vom Malz zum Bier</h1>'+
   '<p class="lead">Du bist Braumeisterin oder Braumeister. Zuerst wählst du einen Bierstil, dann führst du dein Bier durch fünf Stationen. Rohstoffe, Mengen, Temperaturen und Zeiten stellst du selbst ein.</p>'+
   '<ul><li>Zur Wahl stehen zwei Klassiker und zwei <b>Craft-Biere</b>. Jeder Stil hat eigene Zielwerte für Stammwürze, Bitterkeit, Farbe und Aroma.</li>'+
   '<li>Nach jeder Station kommt eine Wissensfrage. Eine richtige Antwort gibt <b>5 Bonuspunkte</b> und einen <b>Tipp</b> für die nächste Station.</li>'+
   '<li>Machst du einen groben Fehler, gibt es einen <b>Fehlsud</b>. Das ist nicht schlimm: Du erfährst, was schiefgelaufen ist, und versuchst es nochmals (2 Punkte Abzug).</li>'+
   '<li>Am Ende gibt es eine Verkostung mit Punkten, Pokal und einer Übersicht, was du besser machen kannst.</li></ul>'+
   '<p class="muted small">Dauer: etwa 15 bis 20 Minuten. Du brauchst nichts zu speichern und musst dich nicht anmelden.</p>'+
   '<div class="actions"><button class="btn" id="go">Los geht es</button></div></div>';
  document.getElementById('go').onclick=function(){ st.screen='style'; render(); };
}

  var h='<div class="card"><h2>Welches Bier willst du brauen?</h2><p>Jeder Stil hat andere Zielwerte. Die Craft-Biere sind anspruchsvoller, weil mehr Faktoren stimmen müssen.</p><div class="stylegrid" role="group" aria-label="Bierstil">';
  Object.keys(STYLES).forEach(function(k){
    var S=STYLES[k], mid=(S.ebc[0]+S.ebc[1])/2;

  });
  h+='</div><div class="actions"><button class="btn" id="go"'+(st.style?'':' disabled')+'>Mit diesem Stil brauen</button></div></div>';

    b.onclick=function(){
      st.style=b.dataset.style;

    '<span class="tv">Farbe '+S.ebc[0]+' bis '+S.ebc[1]+' EBC</span><span class="tv">Reifung '+S.lager[0]+(S.lager[1]!==S.lager[0]?' bis '+S.lager[1]:'')+' Wochen</span></div>';
}
function gaugeBlock(i){ var g=gaugesFor(i); if(!g.length) return ''; return '<div class="gauges">'+g.map(gaugeHTML).join('')+'</div>'; }

function renderStation(){
  var i=st.step, b=bandFor(i), S=STYLES[st.style], h='<div class="card">';
  if(i===0){
    h+='<h2>Station 1: Rohstoffe</h2><p>Bier besteht aus Wasser, Malz, Hopfen und Hefe. Wähle Grundmalz, Spezialmalz und Hefe passend zu deinem Bierstil.</p>'+targetCard()+sceneFor(0)+gaugeBlock(0)+
       choiceGroup('grund','Grundmalz',GRUND)+choiceGroup('spez','Spezialmalz',SPEZ)+choiceGroup('hefe','Hefe',YEASTS);
  } else if(i===1){
    h+='<h2>Station 2: Maischen</h2><p>Das Malz wird geschrotet und mit warmem Wasser vermischt. Die Enzyme aus dem Malz sollen die Stärke zu Zucker abbauen. Je mehr Malz, desto mehr Zucker steckt in der Würze (Stammwürze). Stelle Malzmenge, Temperatur und Rastzeit ein.</p>'+targetCard()+sceneFor(1)+gaugeBlock(1)+
       tipBox(1)+slider('kg','Malzmenge (für 20 Liter)',2,10,0.5,'kg',b.kg,'2 kg','10 kg')+slider('mashT','Maischtemperatur',40,90,1,'°C',b.mashT,'40 °C','90 °C')+slider('mashD','Rastzeit',10,90,5,'min',null,'10 min','90 min');
  } else if(i===2){
    h+='<h2>Station 3: Würze kochen und kühlen</h2><p>Die Würze wird mit Hopfen gekocht. Bitterhopfen kommt zu Beginn in die Pfanne, Aromahopfen erst in den letzten Minuten. Danach wird die Würze abgekühlt und die Hefe zugegeben.</p>'+targetCard()+sceneFor(2)+gaugeBlock(2)+
       tipBox(2)+slider('kochD','Kochdauer',30,120,5,'min',b.kochD,'30 min','120 min')+slider('bitterG','Bitterhopfen (zu Beginn)',0,80,5,'g',b.bitterG,'0 g','80 g')+slider('aromaG','Aromahopfen (letzte 10 Minuten)',0,80,5,'g',null,'0 g','80 g')+slider('anstT','Temperatur beim Anstellen (Hefe zugeben)',4,60,1,'°C',b.anstT,'4 °C','60 °C');
  } else if(i===3){
    h+='<h2>Station 4: Gärung</h2><p>Jetzt arbeitet die Hefe. Im Gärtank siehst du, wie lebhaft sie arbeitet: Je mehr Blasen aufsteigen, desto aktiver ist die Hefe bei der gewählten Temperatur. Stelle Gärtemperatur und Gärdauer ein.</p>'+targetCard()+sceneFor(3)+
       tipBox(3)+slider('gaerT','Gärtemperatur',2,40,1,'°C',b.gaerT,'2 °C','40 °C')+slider('gaerD','Gärdauer',1,14,1,'Tage',b.gaerD,'1 Tag','14 Tage');
  } else {
    h+='<h2>Station 5: Reifung</h2><p>Das Jungbier lagert, bis es klar und rund im Geschmack ist. Bei der Kalthopfung kommt Hopfen ins kühle Bier und bringt Duft, aber keine zusätzliche Bitterkeit.</p>'+targetCard()+sceneFor(4)+gaugeBlock(4)+
       tipBox(4)+slider('lagerW','Lagerdauer',0,8,1,'Wochen',b.lagerW,'0 Wochen','8 Wochen')+slider('lagerT','Lagertemperatur',0,20,1,'°C',b.lagerT,'0 °C','20 °C')+slider('kaltG','Kalthopfung',0,80,5,'g',b.kaltG,'0 g','80 g');
  }
  if(st.fails[i]>0) h+='<div class="box-warn small">Fehlversuche in dieser Station: '+st.fails[i]+'</div>';
  h+='<div class="actions"><button class="btn" id="go"'+(i===0&&!(st.grund&&st.spez&&st.hefe)?' disabled':'')+'>'+(i===3?'Gärung starten':(i===4?'Bier abfüllen':'Weiter'))+'</button></div></div>';
  app.innerHTML=h;
  Array.prototype.forEach.call(app.querySelectorAll('button.choice'),function(btn){
    btn.onclick=function(){
      st[btn.dataset.key]=btn.dataset.val;
      Array.prototype.forEach.call(app.querySelectorAll('button.choice[data-key="'+btn.dataset.key+'"]'),function(o){ o.setAttribute('aria-pressed',o===btn?'true':'false'); });
      document.getElementById('go').disabled=!(st.grund&&st.spez&&st.hefe);
      updateLive();
    };
  });
  Array.prototype.forEach.call(app.querySelectorAll('input[type=range]'),function(inp){
    inp.oninput=function(){ st[inp.id]=+inp.value; document.getElementById('o_'+inp.id).textContent=inp.value+' '+inp.dataset.unit; updateLive(); };
  });
  updateLive();
  document.getElementById('go').onclick=function(){
    var r=EVALS[i]();
    if(r.fail){ st.fails[i]++; st.res[i]=r; st.screen='fail'; }
    else {
      r.final=Math.max(0,Math.round(r.pts)-RETRY_COST*st.fails[i]);
      st.pts[i]=r.final; st.res[i]=r;
      if(i===1) st.S0=r.S0;
      st.screen='result';
    }
    render();
  };
}

function renderFail(){
  var i=st.step, f=st.res[i].fail;
  app.innerHTML='<div class="card"><div class="box-bad"><h2>'+esc(f.title)+'</h2><p>'+esc(f.text)+'</p></div>'+
    '<div class="tip"><b>Was du daraus lernst:</b> '+esc(f.tip)+'</div>'+
    '<p class="muted small">Ein Fehlsud gehört zum Brauen dazu. Du versuchst die Station nochmals, das kostet '+RETRY_COST+' Punkte.</p>'+
    '<div class="actions"><button class="btn" id="go">Station nochmals versuchen</button></div></div>';
  document.getElementById('go').onclick=function(){ st.screen='station'; render(); };
}

function renderResult(){
  var i=st.step, r=st.res[i], h='<div class="card"><h2>Ergebnis: '+NAMES[i]+'</h2>';
  h+='<div class="score"><div class="bar" role="img" aria-label="'+r.final+' von '+MAXPTS+' Punkten"><i style="width:'+(r.final/MAXPTS*100)+'%"></i></div><b>'+r.final+' / '+MAXPTS+'</b></div>';
  if(st.fails[i]>0) h+='<p class="muted small">Abzug für '+st.fails[i]+' Fehlversuch(e): −'+(RETRY_COST*st.fails[i])+' Punkte</p>';
  if(i===3){
    h+='<div class="legend" aria-hidden="true"><span class="l1">Zucker (°P)</span><span class="l2">Alkohol (Vol.-%)</span></div>'+
       '<canvas id="chart" role="img" aria-label="Verlauf von Zucker und Alkohol während der Gärung"></canvas>'+
       '<div class="readouts" aria-live="off"><div><b id="r_s">–</b><span>Zucker im Bier (°P)</span></div><div><b id="r_a">–</b><span>Alkohol (Vol.-%)</span></div><div><b id="r_c">–</b><span>CO₂ entstanden (g/L)</span></div></div>'+
       '<div class="actions" style="margin-top:0"><button class="btn ghost" id="skip" type="button">Animation überspringen</button></div>'+
       '<p class="muted small">Aus einem Zuckermolekül entstehen je zwei Moleküle Alkohol und CO₂. Das meiste CO₂ entweicht aber aus dem Gärbehälter, ein kleiner Teil bleibt im Bier gelöst.</p>';
  }
  h+='<ul class="fb">';
  r.lines.forEach(function(l){ h+='<li class="'+(l.ok?'ok':'no')+'"><span class="mark">'+(l.ok?'gut':'besser')+'</span><span>'+esc(l.t)+'</span></li>'; });
  h+='</ul><div class="actions"><button class="btn" id="go">Weiter zur Frage</button></div></div>';
  app.innerHTML=h;
  document.getElementById('go').onclick=function(){ st.screen='quiz'; render(); };
  if(i===3) startChart(r);
}

function startChart(r){
  var cv=document.getElementById('chart'), D=st.gaerD, S0=st.S0, sim=r.sim;
  var dpr=window.devicePixelRatio||1, W=cv.clientWidth, H=cv.clientHeight;
  cv.width=W*dpr; cv.height=H*dpr;
  var ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  var ymax=Math.max(8,Math.ceil(S0/2)*2+1), L=44,R=12,T=12,B=30;
  function X(t){ return L+(W-L-R)*t/D; }
  function Y(v){ return T+(H-T-B)*(1-v/ymax); }
  function draw(t){
    ctx.clearRect(0,0,W,H);
    ctx.font='12px "Source Sans 3",system-ui,sans-serif'; ctx.fillStyle='#555'; ctx.strokeStyle='#e2e2e2'; ctx.lineWidth=1;
    var yt=ymax<=10?2:(ymax<=16?4:5);
    for(var v=0;v<=ymax;v+=yt){ ctx.beginPath(); ctx.moveTo(L,Y(v)); ctx.lineTo(W-R,Y(v)); ctx.stroke(); ctx.textAlign='right'; ctx.fillText(String(v),L-6,Y(v)+4); }
    var xs=D<=7?1:2; ctx.textAlign='center';
    for(var d=0;d<=D;d+=xs){ ctx.fillText(String(d),X(d),H-12); }
    ctx.textAlign='right'; ctx.fillText('Tage',W-R,H-12);
    function line(key,color,dash){
      ctx.beginPath(); ctx.strokeStyle=color; ctx.lineWidth=3; ctx.setLineDash(dash);
      var n=Math.max(2,Math.round(t*20));
      for(var k=0;k<=n;k++){ var tt=t*k/n, v2=sim(tt)[key]; if(k===0) ctx.moveTo(X(tt),Y(v2)); else ctx.lineTo(X(tt),Y(v2)); }
      ctx.stroke(); ctx.setLineDash([]);
    }
    line('sugar','#2f6b4a',[]); line('alc','#b86b00',[8,5]);
    var c=sim(t);
    document.getElementById('r_s').textContent=c.sugar.toFixed(1);
    document.getElementById('r_a').textContent=c.alc.toFixed(1);
    document.getElementById('r_c').textContent=c.co2.toFixed(0);
  }
  var reduce=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ draw(D); document.getElementById('skip').style.display='none'; return; }
  var t0=null, dur=4500;
  function frame(ts){
    if(t0===null) t0=ts;
    var p=Math.min(1,(ts-t0)/dur); draw(D*p);
    if(p<1) raf=requestAnimationFrame(frame); else raf=0;
  }
  draw(0.001);
  raf=requestAnimationFrame(frame);
  document.getElementById('skip').onclick=function(){ stopAnim(); draw(D); };
}

function renderQuiz(){
  var i=st.step;
  if(!st.q[i]){
    var pick=QUIZ[i][Math.floor(Math.random()*QUIZ[i].length)];
    var order=shuffle([0,1,2,3]);
    st.q[i]={q:pick.q,e:pick.e,opts:order.map(function(k){return pick.o[k];}),right:order.indexOf(0),ans:null};
  }
  var q=st.q[i], h='<div class="card"><h2>Wissensfrage</h2><p class="lead">'+esc(q.q)+'</p><div class="qopts">';
  q.opts.forEach(function(o,k){
    var cls='qopt', tag='';
    if(q.ans!==null){ if(k===q.right){cls+=' right';tag='<span class="tag">richtig</span>';} else if(k===q.ans){cls+=' wrong';tag='<span class="tag">falsch</span>';} }
    h+='<button type="button" class="'+cls+'" data-k="'+k+'"'+(q.ans!==null?' disabled':'')+'>'+tag+esc(o)+'</button>';
  });
  h+='</div>';
  if(q.ans!==null){
    var ok=q.ans===q.right;
    h+='<div class="'+(ok?'tip':'box-warn')+'"><b>'+(ok?'Richtig! +'+BONUS+' Punkte'+(i<4?' und ein Tipp für die nächste Station.':'.'):'Nicht ganz.')+'</b> '+esc(q.e)+'</div>'+
       '<div class="actions"><button class="btn" id="go">'+(i<4?'Weiter zur nächsten Station':'Bier verkosten')+'</button></div>';
  } else {
    h+='<p class="hint-line">Eine falsche Antwort kostet keine Punkte, du bekommst dann einfach keinen Bonus.</p>';
  }
  h+='</div>';
  app.innerHTML=h;
  Array.prototype.forEach.call(app.querySelectorAll('button.qopt'),function(b){
    b.onclick=function(){
      q.ans=+b.dataset.k;
      if(q.ans===q.right){ st.bonus[i]=BONUS; if(i<4) st.hints[i+1]=true; }
      setHeader(); var y=window.scrollY; stopAnim(); renderQuiz(); window.scrollTo(0,y);
    };
  });
  var go=document.getElementById('go');
  if(go) go.onclick=function(){ if(i<4){ st.step=i+1; st.screen='station'; } else { st.screen='final'; if(total()>st.best) st.best=total(); } render(); };
}

function level(p){
  if(p<35) return {name:'Fehlsud, aber viel gelernt',col:'#8a8a8a',txt:'Dieses Bier ist nicht gelungen. Schau dir unten an, wo es hakte, und braue es nochmals.'};
  if(p<60) return {name:'Hausbier',col:'#a8693a',txt:'Trinkbar, aber mit Macken. Mit besseren Einstellungen geht mehr.'};
  if(p<80) return {name:'Gutes Bier',col:'#9aa3ad',txt:'Ein ordentliches Bier. Wenige Feinheiten fehlen noch zum Meister.'};
  return {name:'Meisterbier',col:'#d4a017',txt:'Hervorragend gebraut. Du verstehst, wie Malz, Hopfen, Hefe und Temperatur zusammenspielen.'};
}
function trophy(col){
  return '<svg class="trophy" viewBox="0 0 120 120" role="img" aria-label="Pokal"><path d="M34 18h52v26c0 16-12 28-26 28S34 60 34 44z" fill="'+col+'"/><path d="M34 26H18c0 18 8 28 20 30M86 26h16c0 18-8 28-20 30" fill="none" stroke="'+col+'" stroke-width="7" stroke-linecap="round"/><rect x="54" y="70" width="12" height="18" fill="'+col+'"/><rect x="38" y="88" width="44" height="12" rx="4" fill="'+col+'"/></svg>';
}
function cmpRow(label,ist,win,unit,dec){
  var ok=ist>=win[0]&&ist<=win[1];
  return '<tr><td>'+label+'</td><td class="n">'+win[0]+'–'+win[1]+' '+unit+'</td><td class="n">'+ist.toFixed(dec)+' '+unit+'</td><td class="'+(ok?'ok':'no')+'">'+(ok?'im Ziel':(ist<win[0]?'zu tief':'zu hoch'))+'</td></tr>';
}
function renderFinal(){
  var p=total(), lv=level(p), S=STYLES[st.style], y=YEASTS[st.hefe], r4=st.res[3], ebc=ebcNow(), ibu=ibuNow(), aro=aromaNow();
  var h='<div class="card final-head">'+
    '<svg class="finalglass" viewBox="0 0 100 140" role="img" aria-label="Frisch gezapftes '+esc(S.name)+'">'+glassSVG('fin',ebc,true,true)+'</svg>'+
    trophy(lv.col)+'<h1>'+lv.name+'</h1><div class="big">'+p+' / 100</div><p>'+lv.txt+'</p></div>';
  h+='<div class="card"><h2>Dein '+esc(S.name)+'</h2><div class="facts">'+
     '<div><span>Grundmalz</span><b>'+esc(GRUND[st.grund].name)+'</b></div>'+
     '<div><span>Spezialmalz</span><b>'+esc(SPEZ[st.spez].name)+'</b></div>'+
     '<div><span>Hefe</span><b>'+esc(y.name)+'</b></div>'+
     '<div><span>Alkoholgehalt</span><b>'+r4.end.alc.toFixed(1)+' Vol.-%</b></div>'+
     '<div><span>Vergärung</span><b>'+Math.round(r4.deg*100)+' %</b></div>'+
     '<div><span>Kalthopfung</span><b>'+st.kaltG+' g</b></div></div></div>';
  h+='<div class="card"><h2>Verkostung: Soll und Ist</h2><table class="cmp"><thead><tr><th>Merkmal</th><th class="n">Ziel</th><th class="n">Dein Bier</th><th>Urteil</th></tr></thead><tbody>'+
     cmpRow('Stammwürze',st.S0,S.S0,'°P',1)+cmpRow('Bitterkeit',ibu,S.ibu,'IBU',0)+cmpRow('Farbe',ebc,S.ebc,'EBC',0)+cmpRow('Hopfenaroma',aro,S.aroma,'',0)+cmpRow('Reifung',st.lagerW,S.lager,'Wo.',0)+'</tbody></table></div>';
  h+='<div class="card"><h2>Punkte pro Station</h2><table><thead><tr><th>Station</th><th class="n">Station</th><th class="n">Quiz</th><th class="n">Fehlsude</th></tr></thead><tbody>';
  for(var i=0;i<5;i++) h+='<tr><td>'+NAMES[i]+'</td><td class="n">'+st.pts[i]+' / '+MAXPTS+'</td><td class="n">'+st.bonus[i]+' / '+BONUS+'</td><td class="n">'+st.fails[i]+'</td></tr>';
  h+='</tbody></table></div>';
  var bad=[];
  for(var j=0;j<5;j++) st.res[j].lines.forEach(function(l){ if(!l.ok) bad.push({s:NAMES[j],t:l.t}); });
  h+='<div class="card"><h2>Das kannst du besser machen</h2>';
  if(!bad.length) h+='<p>Nichts. Alle Einstellungen waren gut gewählt.</p>';
  else { h+='<ul class="fb">'; bad.forEach(function(b){ h+='<li class="no"><span class="mark">'+esc(b.s)+'</span><span>'+esc(b.t)+'</span></li>'; }); h+='</ul>'; }
  h+='</div><div class="card"><p class="muted small" style="margin:0">Bier ist ein Genussmittel mit Alkohol. In der Schweiz dürfen gegorene Getränke wie Bier und Wein erst ab 16 Jahren abgegeben werden, gebrannte Wasser ab 18. Beste Punktzahl in dieser Sitzung: '+st.best+'.</p></div>';
  h+='<div class="actions"><button class="btn" id="again">Nochmals brauen</button><button class="btn ghost" id="other">Anderen Bierstil wählen</button></div>';
  app.innerHTML=h;
  document.getElementById('again').onclick=function(){ var s=st.style; st=newState(); st.style=s; st.screen='station'; render(); };
  document.getElementById('other').onclick=function(){ st=newState(); st.screen='style'; render(); };
}

st=newState();
render();
})();
</script>
</body>
